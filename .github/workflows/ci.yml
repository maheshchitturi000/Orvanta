name: CI

on:
  push:
    branches-ignore: [main] # main runs CI as the first step of deploy.yml
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Microservices/Orvanta.slnx -c Release
      - name: Test
        run: dotnet test Microservices/tests/Orvanta.UnitTests/Orvanta.UnitTests.csproj -c Release --no-build

  frontend:
    runs-on: ubuntu-latest
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npx ng build
      - name: Test
        run: npx ng test --watch=false
