<app-auth-shell heading="Welcome back" subheading="Sign in to continue to Orvanta AI.">
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (infoMessage()) {
      <div class="alert success" role="status">{{ infoMessage() }}</div>
    }
    @if (errorMessage()) {
      <div class="alert error" role="alert">{{ errorMessage() }}</div>
    }

    <div class="field">
      <label for="email">Email</label>
      <input id="email" class="input" type="email" formControlName="email" autocomplete="username"
             placeholder="you@example.com" [class.invalid]="showError('email')" />
      @if (showError('email')) {
        <span class="error-text">{{ errorFor('email') }}</span>
      }
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-group">
        <input id="password" class="input" [type]="showPassword() ? 'text' : 'password'"
               formControlName="password" autocomplete="current-password" placeholder="Your password"
               [class.invalid]="showError('password')" />
        <button type="button" class="input-action" (click)="showPassword.set(!showPassword())"
                [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>
      @if (showError('password')) {
        <span class="error-text">{{ errorFor('password') }}</span>
      }
    </div>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
      @if (submitting()) {
        <span class="spinner"></span> Signing in…
      } @else {
        Sign in
      }
    </button>

    <div class="divider"><span>New to Orvanta?</span></div>

    <a class="btn btn-outline btn-block" routerLink="/register">Create an account</a>
  </form>
</app-auth-shell>
