<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orvanta – Start applying</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f5ff;
           font: 15px/1.5 Inter, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #1d1636; }
    .card { width: min(440px, calc(100vw - 32px)); padding: 28px; border-radius: 20px; background: #fff;
            border: 1px solid #ece8f8; box-shadow: 0 24px 60px rgba(99, 67, 224, 0.14); text-align: center; }
    .mark { display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px;
            background: linear-gradient(135deg, #8b6cff, #6343e0); color: #fff; font-weight: 700; font-size: 20px; }
    h1 { font-size: 20px; margin: 14px 0 6px; }
    p { margin: 0 0 18px; color: #6e6790; }
    button { width: 100%; height: 44px; border: 0; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; }
    .primary { background: #7c5cff; color: #fff; }
    .ghost { margin-top: 8px; background: transparent; color: #6e6790; }
    .error { color: #d93a4a; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <span class="mark">O</span>
    <h1>Allow Orvanta on job sites</h1>
    <p>Jobs from LinkedIn, Indeed and Glassdoor often open on the company's own careers site. Allow Orvanta there so it can
       fill and submit those forms too.</p>
    <button id="allow" class="primary">Allow &amp; start applying</button>
    <button id="skip" class="ghost">Start without it (known sites only)</button>
    <div id="error" class="error"></div>
  </div>
  <script src="start.js"></script>
</body>
</html>
