<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orvanta options</title>
  <style>
    body { margin: 0; padding: 16px; font: 14px/1.45 Inter, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #1d1636; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; height: 38px; padding: 0 10px; border: 1px solid #ddd6f3; border-radius: 10px; font: inherit; }
    button { margin-top: 10px; height: 36px; padding: 0 16px; border: 0; border-radius: 10px; background: #7c5cff; color: #fff; font-weight: 600; cursor: pointer; }
    small { color: #6e6790; }
  </style>
</head>
<body>
  <label for="api">Orvanta API (Gateway) URL</label>
  <input id="api" placeholder="http://localhost:5095/api">
  <small>Change this when Orvanta is deployed. Remember to add the host to the extension's host permissions.</small>
  <br><button id="save">Save</button> <small id="saved"></small>
  <script src="options.js"></script>
</body>
</html>
